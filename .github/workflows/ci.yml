name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🔍 Syntax check
        run: |
          node -c main.js
          node -c preload.js
          echo "✅ All JS files pass syntax check"
